name: ci

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # The AppHost uses .NET Aspire 8, which ships as an SDK workload.
      - name: Install the Aspire workload
        run: dotnet workload install aspire

      - name: Restore
        run: dotnet restore IncidentFlow.sln

      - name: Build
        run: dotnet build IncidentFlow.sln --no-restore -c Release

      # Integration tests start PostgreSQL and Redis with Testcontainers; the runner has Docker.
      # LogFilePrefix gives each test project its own .trx file instead of overwriting one name.
      - name: Test
        run: dotnet test IncidentFlow.sln --no-build -c Release --logger "trx;LogFilePrefix=results" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
